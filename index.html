<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Memory Puzzle</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #eef2ff, #f8fafc);
        }

        .game {
            width: 420px;
            padding: 30px;
            background: white;
            border-radius: 18px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.1);
            text-align: center;
        }

        h1 {
            color: #1e293b;
            margin-bottom: 8px;
        }

        .instruction {
            color: #64748b;
            margin-bottom: 15px;
        }

        .target {
            font-size: 18px;
            font-weight: bold;
            color: #4f46e5;
            margin-bottom: 15px;
        }

        .score {
            margin-bottom: 20px;
            font-size: 16px;
            font-weight: bold;
            color: #334155;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        .cell {
            height: 70px;
            display: flex;
            justify-content: center;
            align-items: center;

            border-radius: 10px;
            background: #4f46e5;
            color: white;

            font-size: 24px;
            font-weight: bold;

            cursor: pointer;
            user-select: none;
        }

        .cell:hover {
            background: #4338ca;
        }

        .cell.correct {
            background: #22c55e;
        }

        .cell.wrong {
            background: #ef4444;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 12px;

            border: none;
            border-radius: 8px;

            background: #0f172a;
            color: white;

            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1e293b;
        }

        #message {
            margin-top: 15px;
            min-height: 24px;
            font-weight: bold;
        }

        .success {
            color: #16a34a;
        }

        .error {
            color: #dc2626;
        }

        .backend {
            margin-top: 12px;
            font-size: 14px;
            color: #64748b;
        }
    </style>
</head>

<body>

<div class="game">

    <h1>🧠 Memory Puzzle</h1>

    <p class="instruction">
        Click the letters in the correct order
    </p>

    <div class="target">
        Target: Z → O → H → O
    </div>

    <div class="score">
        Score: <span id="score">0</span>
    </div>

    <div class="grid" id="grid">

        <div class="cell">A</div>
        <div class="cell">Z</div>
        <div class="cell">B</div>
        <div class="cell">C</div>

        <div class="cell">D</div>
        <div class="cell">E</div>
        <div class="cell">O</div>
        <div class="cell">F</div>

        <div class="cell">G</div>
        <div class="cell">I</div>
        <div class="cell">J</div>
        <div class="cell">H</div>

        <div class="cell">O</div>
        <div class="cell">K</div>
        <div class="cell">L</div>
        <div class="cell">M</div>

    </div>

    <div id="message"></div>

    <div class="backend" id="backendStatus">
        Backend: Waiting
    </div>

    <button onclick="restartGame()">
        Restart Game
    </button>

</div>


<script>

    // ==========================================
    // CATALYST JAVA BACKEND
    // ==========================================

   const API_URL =
    "https://demo-60084120945.development.catalystserverless.in/server/helloWorld/execute";

    // ==========================================
    // GAME VARIABLES
    // ==========================================

    const targetSequence = ["Z", "O", "H", "O"];

    let currentStep = 0;

    let score = 0;

    let gameFinished = false;


    const cells = document.querySelectorAll(".cell");

    const scoreDisplay =
        document.getElementById("score");

    const message =
        document.getElementById("message");

    const backendStatus =
        document.getElementById("backendStatus");


    // ==========================================
    // CELL CLICK
    // ==========================================

    cells.forEach(cell => {

        cell.addEventListener("click", function () {

            if (gameFinished) {
                return;
            }

            const letter = cell.textContent;


            // Correct answer
            if (letter === targetSequence[currentStep]) {

                cell.classList.add("correct");

                currentStep++;

                score += 10;

                scoreDisplay.textContent = score;


                // Player completed puzzle
                if (currentStep === targetSequence.length) {

                    gameFinished = true;

                    message.textContent =
                        "🎉 You Win!";

                    message.className = "success";


                    // SEND SCORE TO JAVA
                    sendScore(score);
                }

            }

            // Wrong answer
            else {

                cell.classList.add("wrong");

                score -= 2;

                if (score < 0) {
                    score = 0;
                }

                scoreDisplay.textContent = score;

                message.textContent =
                    "❌ Wrong letter! Try again.";

                message.className = "error";


                setTimeout(() => {
                    cell.classList.remove("wrong");
                }, 500);
            }

        });

    });


    // ==========================================
    // SEND SCORE TO JAVA BACKEND
    // ==========================================

    async function sendScore(score) {

        backendStatus.textContent =
            "Backend: Sending score...";


        try {

            const url =
                API_URL +
                "?score=" +
                encodeURIComponent(score);


            const response = await fetch(url, {
                method: "POST"
            });


            if (!response.ok) {

                throw new Error(
                    "HTTP " + response.status
                );
            }


            const data =
                await response.json();


            console.log(
                "Java Backend Response:",
                data
            );


            backendStatus.textContent =
                "Backend: Score saved ✓";


        } catch (error) {

            console.error(
                "Backend Error:",
                error
            );


            backendStatus.textContent =
                "Backend: Connection failed";

        }

    }


    // ==========================================
    // RESTART GAME
    // ==========================================

    function restartGame() {

        currentStep = 0;

        score = 0;

        gameFinished = false;


        scoreDisplay.textContent = "0";

        message.textContent = "";

        backendStatus.textContent =
            "Backend: Waiting";


        cells.forEach(cell => {

            cell.classList.remove("correct");
            cell.classList.remove("wrong");

        });

    }

</script>

</body>
</html>
