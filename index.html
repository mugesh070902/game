<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Memory Puzzle</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;

            background: linear-gradient(
                135deg,
                #eef2ff,
                #f8fafc
            );
        }

        .game {
            width: 420px;
            padding: 30px;

            background: white;

            border-radius: 18px;

            box-shadow:
                0 15px 40px rgba(0, 0, 0, 0.10);

            text-align: center;
        }

        h1 {
            color: #1e293b;
            margin-bottom: 8px;
        }

        .instruction {
            color: #64748b;
            margin-bottom: 15px;
        }

        /* Player Name */

        #playerName {
            width: 100%;

            padding: 12px;

            margin-bottom: 15px;

            border: 1px solid #cbd5e1;

            border-radius: 8px;

            font-size: 16px;

            outline: none;
        }

        #playerName:focus {
            border-color: #4f46e5;
        }

        .target {
            font-size: 18px;

            font-weight: bold;

            color: #4f46e5;

            margin-bottom: 15px;
        }

        .score {
            margin-bottom: 20px;

            font-size: 16px;

            font-weight: bold;

            color: #334155;
        }

        /* Game Grid */

        .grid {
            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 10px;
        }

        .cell {
            height: 70px;

            display: flex;

            justify-content: center;

            align-items: center;

            border-radius: 10px;

            background: #4f46e5;

            color: white;

            font-size: 24px;

            font-weight: bold;

            cursor: pointer;

            user-select: none;

            transition: 0.2s;
        }

        .cell:hover {
            background: #4338ca;
        }

        .cell.correct {
            background: #22c55e;

            cursor: default;
        }

        .cell.wrong {
            background: #ef4444;
        }

        /* Button */

        button {
            width: 100%;

            margin-top: 20px;

            padding: 12px;

            border: none;

            border-radius: 8px;

            background: #0f172a;

            color: white;

            font-size: 16px;

            cursor: pointer;
        }

        button:hover {
            background: #1e293b;
        }

        /* Messages */

        #message {
            margin-top: 15px;

            min-height: 24px;

            font-weight: bold;
        }

        .success {
            color: #16a34a;
        }

        .error {
            color: #dc2626;
        }

        /* Backend Status */

        .backend {
            margin-top: 12px;

            font-size: 14px;

            color: #64748b;
        }

    </style>

</head>

<body>

<div class="game">

    <h1>🧠 Memory Puzzle</h1>

    <p class="instruction">
        Enter your name and click the letters in the correct order
    </p>

    <!-- Player Name -->

    <input
        type="text"
        id="playerName"
        placeholder="Enter your name"
        maxlength="30"
        autocomplete="off"
    >

    <!-- Target -->

    <div class="target">
        Target: Z → O → H → O
    </div>

    <!-- Score -->

    <div class="score">
        Score:
        <span id="score">0</span>
    </div>

    <!-- Game Grid -->

    <div class="grid" id="grid">

        <div class="cell">A</div>
        <div class="cell">Z</div>
        <div class="cell">B</div>
        <div class="cell">C</div>

        <div class="cell">D</div>
        <div class="cell">E</div>
        <div class="cell">O</div>
        <div class="cell">F</div>

        <div class="cell">G</div>
        <div class="cell">I</div>
        <div class="cell">J</div>
        <div class="cell">H</div>

        <div class="cell">O</div>
        <div class="cell">K</div>
        <div class="cell">L</div>
        <div class="cell">M</div>

    </div>

    <!-- Game Message -->

    <div id="message"></div>

    <!-- Backend Status -->

    <div class="backend" id="backendStatus">
        Backend: Waiting
    </div>

    <!-- Restart -->

    <button onclick="restartGame()">
        Restart Game
    </button>

</div>


<script>

    /*
     * Deployed Catalyst Java Function
     */

    const API_URL =
        "https://demo-60084120945.development.catalystserverless.in/server/helloWorld/execute";


    /*
     * Target sequence
     */

    const targetSequence = [
        "Z",
        "O",
        "H",
        "O"
    ];


    /*
     * Game variables
     */

    let currentStep = 0;

    let score = 0;

    let gameFinished = false;


    /*
     * DOM elements
     */

    const cells =
        document.querySelectorAll(".cell");

    const scoreDisplay =
        document.getElementById("score");

    const message =
        document.getElementById("message");

    const backendStatus =
        document.getElementById("backendStatus");

    const playerNameInput =
        document.getElementById("playerName");


    /*
     * Handle cell clicks
     */

    cells.forEach(cell => {

        cell.addEventListener("click", function () {

            /*
             * Don't allow clicks after game completion
             */

            if (gameFinished) {
                return;
            }


            /*
             * Don't allow clicking an already
             * correctly selected cell
             */

            if (cell.classList.contains("correct")) {
                return;
            }


            const letter =
                cell.textContent;


            /*
             * Correct letter
             */

            if (
                letter ===
                targetSequence[currentStep]
            ) {

                cell.classList.add("correct");

                currentStep++;

                score += 10;

                scoreDisplay.textContent =
                    score;


                /*
                 * Check game completion
                 */

                if (
                    currentStep ===
                    targetSequence.length
                ) {

                    gameFinished = true;

                    message.textContent =
                        "🎉 You Win!";

                    message.className =
                        "success";


                    /*
                     * Send player name + score
                     * to Java backend
                     */

                    sendScore(score);
                }

            }


            /*
             * Wrong letter
             */

            else {

                cell.classList.add("wrong");

                score -= 2;


                /*
                 * Score cannot go below zero
                 */

                if (score < 0) {
                    score = 0;
                }


                scoreDisplay.textContent =
                    score;


                message.textContent =
                    "❌ Wrong letter! Try again.";

                message.className =
                    "error";


                /*
                 * Remove red color
                 * after 500 milliseconds
                 */

                setTimeout(() => {

                    cell.classList.remove("wrong");

                }, 500);

            }

        });

    });


    /*
     * Send score to Java backend
     */

    async function sendScore(score) {

        /*
         * Get player name
         */

        let playerName =
            playerNameInput.value.trim();


        /*
         * If name is empty,
         * use Guest
         */

        if (playerName === "") {

            playerName = "Guest";

        }


        /*
         * Show sending status
         */

        backendStatus.textContent =
            "Backend: Sending score...";


        try {

            /*
             * Build API URL
             *
             * Example:
             *
             * ?name=Mugesh&score=40
             */

            const url =
                API_URL
                + "?name="
                + encodeURIComponent(playerName)
                + "&score="
                + encodeURIComponent(score);


            /*
             * Send POST request
             */

            const response =
                await fetch(
                    url,
                    {
                        method: "POST"
                    }
                );


            /*
             * Check HTTP response
             */

            if (!response.ok) {

                throw new Error(
                    "HTTP " + response.status
                );

            }


            /*
             * Read backend response
             */

            const data =
                await response.json();


            /*
             * Show response in browser console
             */

            console.log(
                "Java Backend Response:",
                data
            );


            /*
             * Backend successfully received
             * the score
             */

            backendStatus.textContent =
                "Backend: Score received ✓";


        } catch (error) {

            console.error(
                "Backend Error:",
                error
            );


            backendStatus.textContent =
                "Backend: Connection failed";

        }

    }


    /*
     * Restart Game
     */

    function restartGame() {

        currentStep = 0;

        score = 0;

        gameFinished = false;


        /*
         * Reset score
         */

        scoreDisplay.textContent =
            "0";


        /*
         * Reset messages
         */

        message.textContent = "";

        message.className = "";


        /*
         * Reset backend status
         */

        backendStatus.textContent =
            "Backend: Waiting";


        /*
         * Remove cell states
         */

        cells.forEach(cell => {

            cell.classList.remove("correct");

            cell.classList.remove("wrong");

        });

    }

</script>

</body>

</html>
