<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Catalyst Frontend Demo</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #eef2ff, #f8fafc);
        }

        .container {
            width: 420px;
            padding: 30px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
            color: #1e293b;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #334155;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: #6366f1;
        }

        button {
            width: 100%;
            margin-top: 18px;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #4f46e5;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            background: #4338ca;
        }

        button:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }

        .result {
            margin-top: 25px;
            padding: 15px;
            border-radius: 8px;
            background: #f1f5f9;
            color: #334155;
            min-height: 50px;
            display: none;
        }

        .result.success {
            display: block;
            border-left: 4px solid #22c55e;
        }

        .result.error {
            display: block;
            border-left: 4px solid #ef4444;
            color: #b91c1c;
        }

        .status {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
            color: #64748b;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🚀 Catalyst Demo</h1>

    <p class="subtitle">
        Frontend → Java Serverless Backend
    </p>

    <label for="name">Enter your name</label>

    <input
        type="text"
        id="name"
        placeholder="e.g. Mugesh"
    >

    <button id="callBackendBtn">
        Call Java Backend
    </button>

    <div id="result" class="result"></div>

    <div id="status" class="status"></div>

</div>


<script>

    // Your deployed Catalyst Java function
    const API_URL =
        "https://demo-60084120945.development.catalystserverless.in/server/helloWorld/execute";


    const nameInput = document.getElementById("name");
    const button = document.getElementById("callBackendBtn");
    const result = document.getElementById("result");
    const status = document.getElementById("status");


    button.addEventListener("click", callBackend);


    async function callBackend() {

        const name = nameInput.value.trim();


        // Validate input
        if (!name) {

            showError("Please enter your name.");

            return;
        }


        // Loading state
        button.disabled = true;
        button.textContent = "Calling Backend...";
        status.textContent = "Connecting to Catalyst...";

        result.style.display = "none";


        try {

            const url =
                API_URL +
                "?name=" +
                encodeURIComponent(name);


            const response = await fetch(url, {

                method: "POST"

            });


            // Check HTTP status
            if (!response.ok) {

                throw new Error(
                    "Backend returned HTTP " + response.status
                );
            }


            // Convert response to JSON
            const data = await response.json();


            console.log("Backend response:", data);


            // Display backend response
            showSuccess(data.output);

            status.textContent = "Backend connected successfully ✓";


        } catch (error) {

            console.error("Backend error:", error);

            showError(
                "Unable to connect to the backend. " +
                error.message
            );

            status.textContent = "Backend connection failed";

        } finally {

            button.disabled = false;
            button.textContent = "Call Java Backend";

        }
    }


    function showSuccess(message) {

        result.className = "result success";

        result.textContent = message;

        result.style.display = "block";
    }


    function showError(message) {

        result.className = "result error";

        result.textContent = message;

        result.style.display = "block";
    }

    async function sendScore(score) {

    const API_URL =
        "https://demo-60084120945.development.catalystserverless.in/server/helloWorld/execute";

    try {
        const response = await fetch(
            API_URL + "?score=" + encodeURIComponent(score),
            {
                method: "POST"
            }
        );

        if (!response.ok) {
            throw new Error("HTTP " + response.status);
        }

        const data = await response.json();

        console.log("Backend response:", data);

    } catch (error) {

        console.error("Backend error:", error);

    }
}


</script>

</body>
</html>
