<!DOCTYPE html>
<html>
<head>
<title>ZOHO Memory Card Game</title>

<style>
body {
  font-family: 'Segoe UI', sans-serif;
  background: #f0f0f0;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 30px;
}

h1 {
  color: royalblue;
  margin-bottom: 10px;
}

.info {
  display: flex;
  gap: 30px;
  font-size: 18px;
  font-weight: bold;
  margin-bottom: 20px;
}

#message {
  font-size: 20px;
  font-weight: bold;
  margin: 15px;
}

.row {
  display: flex;
  gap: 15px;
  margin-bottom: 15px;
}

.box {
  width: 80px;
  height: 80px;
  background: gray;
  display: flex;
  justify-content: center;
  align-items: center;
  border-radius: 8px;
  font-size: 24px;
  cursor: pointer;
  user-select: none;
  transition: transform 0.2s, background 0.3s;
}

.box:hover {
  transform: scale(1.05);
}

.letter {
  color: white;
}

/* Hide letters after 10 seconds */
.hide .letter {
  color: transparent;
}

/* Correct selection */
.correct {
  background: green;
}

/* Wrong selection */
.wrong {
  background: indianred;
}

button {
  margin-top: 20px;
  padding: 10px 25px;
  border: none;
  border-radius: 6px;
  background: royalblue;
  color: white;
  font-size: 16px;
  cursor: pointer;
}

button:hover {
  background: darkblue;
}
</style>
</head>

<body>

<h1>ZOHO Memory Card Game</h1>

<p>Remember the letters before they hide!</p>

<div class="info">
  <div>Score: <span id="score">0</span></div>
  <div>Attempts: <span id="attempts">0</span></div>
</div>

<div id="message"></div>

<div id="game">

  <div class="row">
    <div class="box" data-letter="A"><span class="letter">A</span></div>
    <div class="box" data-letter="Z"><span class="letter">Z</span></div>
    <div class="box" data-letter="B"><span class="letter">B</span></div>
    <div class="box" data-letter="C"><span class="letter">C</span></div>
  </div>

  <div class="row">
    <div class="box" data-letter="D"><span class="letter">D</span></div>
    <div class="box" data-letter="E"><span class="letter">E</span></div>
    <div class="box" data-letter="O"><span class="letter">O</span></div>
    <div class="box" data-letter="F"><span class="letter">F</span></div>
  </div>

  <div class="row">
    <div class="box" data-letter="G"><span class="letter">G</span></div>
    <div class="box" data-letter="I"><span class="letter">I</span></div>
    <div class="box" data-letter="J"><span class="letter">J</span></div>
    <div class="box" data-letter="H"><span class="letter">H</span></div>
  </div>

  <div class="row">
    <div class="box" data-letter="O"><span class="letter">O</span></div>
    <div class="box" data-letter="K"><span class="letter">K</span></div>
    <div class="box" data-letter="L"><span class="letter">L</span></div>
    <div class="box" data-letter="M"><span class="letter">M</span></div>
  </div>

</div>

<button onclick="restartGame()">Restart Game</button>

<script>

const target = ["Z", "O", "H", "O"];

let currentIndex = 0;
let score = 0;
let attempts = 0;

const boxes = document.querySelectorAll(".box");
const scoreDisplay = document.getElementById("score");
const attemptsDisplay = document.getElementById("attempts");
const message = document.getElementById("message");
const game = document.getElementById("game");

/* Hide letters after 10 seconds */
setTimeout(() => {
    game.classList.add("hide");
    message.innerText = "Find Z → O → H → O!";
}, 10000);


/* Card click */
boxes.forEach(box => {

    box.addEventListener("click", function() {

        /* Prevent clicking after game completion */
        if (currentIndex >= target.length) {
            return;
        }

        attempts++;
        attemptsDisplay.innerText = attempts;

        const selectedLetter = this.dataset.letter;
        const expectedLetter = target[currentIndex];

        if (selectedLetter === expectedLetter) {

            /* Correct */
            this.classList.add("correct");

            score += 10;
            scoreDisplay.innerText = score;

            currentIndex++;

            if (currentIndex === target.length) {

                message.innerText = "🎉 Congratulations! You found ZOHO!";
                message.style.color = "green";

            } else {

                message.innerText =
                    "Correct! Now find " + target[currentIndex];

            }

        } else {

            /* Wrong */
            this.classList.add("wrong");

            score -= 2;

            if (score < 0) {
                score = 0;
            }

            scoreDisplay.innerText = score;

            message.innerText =
                "❌ Wrong! Find " + target[currentIndex];

            /* Remove wrong color */
            setTimeout(() => {
                this.classList.remove("wrong");
            }, 500);
        }

    });

});


function restartGame() {

    currentIndex = 0;
    score = 0;
    attempts = 0;

    scoreDisplay.innerText = "0";
    attemptsDisplay.innerText = "0";

    message.innerText = "Remember the letters!";

    boxes.forEach(box => {
        box.classList.remove("correct");
        box.classList.remove("wrong");
    });

    game.classList.remove("hide");

    /* Hide again after 10 seconds */
    setTimeout(() => {
        game.classList.add("hide");
        message.innerText = "Find Z → O → H → O!";
    }, 10000);
}

</script>

</body>
</html>
